apiVersion: networking.k8s.io/v1
kind: NetworkPolicy # for restricting communication between pods
metadata:
  name: bankapp-allow-ingress
spec:
  podSelector:
    matchLabels:
      app: nginx
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx # automatically gets labels
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx # helm-chart or app adds labels
      ports:
        - port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: app-database
      ports:
        - port: 3306
    - to: 
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system  #contains coredns which resolves the DNS queries from nginx pods and responds back with the ip address of the db pods.  
      ports:
        - port: 53 #coredns port 
          protocol: UDP

            